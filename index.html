<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>EGETEK Kart Hatırlatıcı v2</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#161a22;--mu:#6b7280;--bd:#e3e6ec;--ac:#0b5fff;--ok:#12805c;--wr:#c2410c;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#eef0f4;--mu:#98a1b3;--bd:#2a3040;--ac:#6ea0ff;--ok:#4ade9f;--wr:#fb923c;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 8px}
.sub,.m{color:var(--mu);font-size:12.5px}
.tot{background:var(--ac);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot b{font-size:24px}.tot .sub{color:#dbe6ff}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.c.od{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.t{font-weight:600;white-space:pre-line}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}
.b.w1{color:var(--wr);border-color:var(--wr)}.b.w2{color:var(--bad);border-color:var(--bad)}.b.tc{color:var(--ac);border-color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 11px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--bad)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,textarea,select{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=date],input[type=time]{cursor:pointer}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:none}.f.o{display:block}
.pd .t,.pd .am{text-decoration:line-through;opacity:.55}
.ck{width:22px;height:22px;accent-color:var(--ok)}
.al{border-radius:10px;padding:8px 12px;margin:8px 0;display:none}
#al{background:#fff4e5;color:#7a3e00;border:1px solid #f5c37a}
#ao{background:#fdeceb;color:#8a1c12;border:1px solid #f0a8a2;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}
.chips{display:flex;gap:6px;margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov.o{display:flex}.ov .c{width:100%;max-width:340px;margin:0}
#lock{background:var(--bg);z-index:20}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.sec{display:none}.sec.o{display:block}
</style>
</head>
<body>
<div class="ov" id="lock"><div class="c"><h2>EGETEK · Kilitli</h2>
  <label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <div class="m" id="pe" style="color:var(--bad)"></div>
  <div style="margin-top:10px"><button class="p" id="un">Aç</button> <button class="d" id="fg">PIN’i unuttum</button></div></div></div>
<div class="ov" id="mp"><div class="c"><h2 id="mt">Ödeme</h2><div class="m" id="mm"></div>
  <label>Ödenen tutar (₺)</label><input id="ma" type="number" step="0.01" inputmode="decimal">
  <div style="margin-top:10px"><button class="p" id="mo">Kaydet</button> <button id="mc">İptal</button></div></div></div>

<div class="w">
  <div class="hd" style="margin-top:0"><div><h1>EGETEK · Kart Hatırlatıcı <span class="b tc">v2</span></h1><div class="sub" id="st">Yerel kayıt</div></div>
  <div><button id="sy">Drive ile eşle</button> <button id="se">Ayarlar</button></div></div>
  <div class="c f" id="fs">
    <label>Google OAuth İstemci Kimliği (Client ID)</label><input id="cid" placeholder="123456-abc.apps.googleusercontent.com">
    <div style="margin-top:8px"><button class="p" id="ss">Kaydet</button> <button id="exp">Yedeği indir</button> <button id="nb">Bildirim aç</button></div>
    <label>PIN kilidi (4-8 rakam, bu cihaza özel)</label><input id="np" type="password" inputmode="numeric" placeholder="Yeni PIN">
    <div style="margin-top:8px"><button class="p" id="sp">PIN belirle</button> <button class="d" id="rp">PIN’i kaldır</button></div>
  </div>
  <div class="al" id="ao"></div><div class="al" id="al"></div>
  <div class="tabs"><button data-t="main" class="on">Ana sayfa</button><button data-t="cards">Kartlarım</button><button data-t="hist">Geçmiş</button></div>

  <div class="sec o" id="t-main">
    <div class="chips"><button data-fl="all" class="on">Tümü</button><button data-fl="sahsi">Şahsi</button><button data-fl="ticari">Ticari</button></div>
    <div class="tot"><div>Ödenmemiş toplam borç<div class="sub" id="tc"></div></div><b id="tt">0 ₺</b></div>

    <div class="hd"><h2>Borçlar</h2><button class="p" id="addD">+ Borç ekle</button></div>
    <div class="c f" id="fd">
      <label>Kart</label><select id="dcard"></select>
      <div id="dextra"><div class="g"><div><label>Açıklama</label><input id="dlab" placeholder="Örn. Akbank Axess"></div>
        <div><label>Tür</label><select id="dtype"><option value="sahsi">Şahsi</option><option value="ticari">Ticari</option></select></div></div></div>
      <div class="g"><div><label>Toplam borç (₺)</label><input id="da" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Asgari ödeme (₺)</label><input id="dmin" type="number" step="0.01" inputmode="decimal"></div></div>
      <label>Son ödeme tarihi</label><input id="dd" type="date">
      <div style="margin-top:10px"><button class="p" id="sd">Kaydet</button> <button id="cd">İptal</button></div>
    </div>
    <div id="dl"></div>

    <div class="hd"><h2>Kart aidatı</h2><button class="p" id="addF">+ Aidat ekle</button></div>
    <div class="c f" id="ff">
      <label>Kart</label><select id="fcard"></select>
      <div id="fextra"><div class="g"><div><label>Açıklama</label><input id="flab"></div>
        <div><label>Tür</label><select id="ftype"><option value="sahsi">Şahsi</option><option value="ticari">Ticari</option></select></div></div></div>
      <div class="g"><div><label>Aidat tarihi</label><input id="fdate" type="date"></div>
      <div><label>Hatırlatma saati</label><input id="ftime" type="time" value="09:00"></div></div>
      <div class="g"><div><label>Tutar (₺, isteğe bağlı)</label><input id="famt" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Tekrar</label><select id="frep"><option value="1">Her yıl</option><option value="0">Tek seferlik</option></select></div></div>
      <div style="margin-top:10px"><button class="p" id="sf">Kaydet</button> <button id="cf">İptal</button></div>
    </div>
    <div id="fl"></div>
  </div>

  <div class="sec" id="t-cards">
    <div class="hd"><h2>Kartlarım</h2><button class="p" id="addK">+ Kart ekle</button></div>
    <div class="c f" id="fk">
      <label>Kart sahibi (isteğe bağlı)</label><input id="kh" placeholder="Kemal GÜLER">
      <label>Kart adı</label><input id="kn" placeholder="Akbank Axess **9133">
      <div class="g"><div><label>Tür</label><select id="kt"><option value="sahsi">Şahsi</option><option value="ticari">Ticari</option></select></div>
      <div><label>Hatırlatma saati</label><input id="ktm" type="time" value="09:00"></div></div>
      <div class="g"><div><label>Hesap kesim günü</label><select id="kc"></select></div>
      <div><label>Son ödeme günü</label><select id="kd"></select></div></div>
      <div class="m">Seçtiğin günlerde her ay otomatik hatırlatma gelir.</div>
      <div style="margin-top:10px"><button class="p" id="sk">Kaydet</button> <button id="ck">İptal</button></div>
    </div>
    <div id="kl"></div>
  </div>

  <div class="sec" id="t-hist">
    <div class="hd"><h2>Ödeme geçmişi ve aylık özet</h2></div>
    <div class="c"><div class="bars" id="bars"></div><label>Ay</label><select id="hm"></select></div>
    <div class="tot"><div>Seçili ay toplam ödeme<div class="sub" id="hs"></div></div><b id="ht">0 ₺</b></div>
    <div id="hb"></div><div id="hl"></div>
  </div>
</div>
<script>
(()=>{
const $=i=>document.getElementById(i),LS="egetek_kart_v2",OLD="egetek_kart_v1",CK="egetek_cid",FN="egetek-kart.json",PK="egetek_pin";
const COLS=["krt","debts","fees","pays","cards"];
let S={};try{S=JSON.parse(localStorage.getItem(LS)||localStorage.getItem(OLD))||{}}catch(e){}
COLS.forEach(c=>S[c]=S[c]||{});
if(!S.mig){
  Object.keys(S.cards).forEach(k=>{const c=S.cards[k];if(c&&!c.del&&c.text&&!S.krt[k])S.krt[k]={name:c.text.split("\n").join(" · "),type:"sahsi",cutDay:c.day,dueDay:"",time:c.time||"09:00",u:Date.now()}});
  ["debts","fees"].forEach(col=>Object.keys(S[col]).forEach(k=>{const d=S[col][k];if(d&&!d.del&&d.label===undefined){d.label=(d.cardText||"").split("\n").join(" · ");d.type="sahsi";d.cardId="";d.paidAmt=d.paid?+d.amount:0;d.done=!!d.paid}}));
  S.mig=1;
}
let tok=null,tokExp=0,fid=null,syncing=false,pend=false,flt="all",edD=null,edK=null,hmSel="",mpCb=null,last=Date.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render();sync(true)};
const put=(col,id,o)=>{const x=S[col][id]||{};Object.assign(x,o,{u:Date.now()});S[col][id]=x;save()};
const del=(col,id)=>{S[col][id]={del:1,u:Date.now()};save()};
const live=col=>Object.keys(S[col]).filter(k=>!S[col][k].del).map(k=>Object.assign({id:k},S[col][k]));
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const tl=n=>Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";
const p2=x=>String(x).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const fd=s=>new Date(s+"T00:00").toLocaleDateString("tr-TR");
const dl=d=>{const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)};
const rem=d=>Math.max(0,(+d.amount||0)-(+d.paidAmt||0));
const tname=t=>t==="ticari"?"Ticari":"Şahsi";
function nextOcc(day,time,from){if(!(+day>=1))return null;const n=from||new Date(),h=(time||"09:00").split(":");let y=n.getFullYear(),m=n.getMonth();
  for(let i=0;i<3;i++){const dim=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(+day,dim),+h[0],+h[1]);if(d>n)return d;m++;if(m>11){m=0;y++}}}
const fmt=d=>d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",weekday:"short"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
const cardOf=id=>id&&S.krt[id]&&!S.krt[id].del?S.krt[id]:null;
function badge(k){return `<span class="b ${k<=1?"w2":k<=3?"w1":""}">${k<0?"GECİKMİŞ "+Math.abs(k)+" gün":k===0?"bugün":k+" gün"}</span>`}

/* ---------- çizim ---------- */
function render(){renderMain();renderCards();renderHist();pushRem()}
function renderMain(){
  const al=[],od=[],by={sahsi:0,ticari:0};let cnt=0,mn=0,h="";
  const D=live("debts"),F=live("fees");
  D.forEach(d=>{if(d.done)return;const r=rem(d),k=dl(d.due+"T00:00");by[d.type]=(by[d.type]||0)+r;
    if(k<0)od.push(`GECİKMİŞ ${Math.abs(k)} gün: ${d.label} · kalan ${tl(r)}`);else if(k<=3)al.push(`Son ödeme ${k===0?"bugün":k+" gün kaldı"}: ${d.label} · ${tl(r)}`)});
  F.forEach(f=>{if(f.done)return;by[f.type]=(by[f.type]||0)+(+f.amount||0);const k=dl(f.date+"T00:00");
    if(k<0)od.push(`GECİKMİŞ ${Math.abs(k)} gün (aidat): ${f.label}`);else if(k<=3)al.push(`Aidat ${k===0?"bugün":k+" gün kaldı"}: ${f.label}`)});
  live("krt").forEach(c=>{[["cutDay","Hesap kesim"],["dueDay","Son ödeme günü"]].forEach(([f,n])=>{const o=nextOcc(c[f],c.time);if(o){const k=dl(o);if(k<=1)al.push(`${k===0?"Bugün":"Yarın"} ${n}: ${c.name}`)}})});
  const ok=x=>flt==="all"||x.type===flt;
  D.filter(ok).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||String(a.due).localeCompare(String(b.due))).forEach(d=>{
    const r=rem(d),k=dl(d.due+"T00:00"),late=!d.done&&k<0;if(!d.done){cnt++;mn+=Math.min(+d.minPay||0,r)}
    h+=`<div class="c ${d.done?"pd":""} ${late?"od":""}"><div class="r"><label style="display:flex;gap:10px;align-items:center;margin:0;color:inherit;font-size:15px"><input class="ck" type="checkbox" data-a="dk" data-i="${d.id}" ${d.done?"checked":""}><span><span class="t">${esc(d.label)}</span><br><span class="m">Son ödeme: ${fd(d.due)}</span></span></label>
    <div style="text-align:right"><b class="am">${tl(d.done?d.amount:r)}</b>${!d.done&&+d.paidAmt>0?`<div class="m">Ödenen ${tl(d.paidAmt)} / ${tl(d.amount)}</div>`:""}</div></div>
    <div style="margin-top:6px"><span class="b tc">${tname(d.type)}</span>${d.done?'<span class="b">Ödendi</span>':badge(k)}${!d.done&&+d.minPay>0?`<span class="b">Asgari ${tl(d.minPay)}</span>`:""}</div>
    <div style="margin-top:8px">${d.done?"":`<button class="p" data-a="dp" data-i="${d.id}">Ödeme yap</button> `}<button data-a="de" data-i="${d.id}">Düzenle</button> <button class="d" data-a="dx" data-i="${d.id}">Sil</button></div></div>`});
  $("dl").innerHTML=h||'<div class="m">Henüz borç eklenmedi.</div>';
  h="";
  F.filter(ok).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||String(a.date).localeCompare(String(b.date))).forEach(f=>{
    const k=dl(f.date+"T00:00"),late=!f.done&&k<0;if(!f.done)cnt++;
    h+=`<div class="c ${f.done?"pd":""} ${late?"od":""}"><div class="r"><label style="display:flex;gap:10px;align-items:center;margin:0;color:inherit;font-size:15px"><input class="ck" type="checkbox" data-a="fk" data-i="${f.id}" ${f.done?"checked":""}><span><span class="t">${esc(f.label)}</span><br><span class="m">Aidat: ${fd(f.date)} ${esc(f.time||"09:00")}${f.rep?" · her yıl":""}</span></span></label><b class="am">${+f.amount>0?tl(f.amount):""}</b></div>
    <div style="margin-top:6px"><span class="b tc">${tname(f.type)}</span>${f.done?'<span class="b">Ödendi</span>':badge(k)}</div>
    <div style="margin-top:8px"><button data-a="fics" data-i="${f.id}">Takvime ekle</button> <button class="d" data-a="fx" data-i="${f.id}">Sil</button></div></div>`});
  $("fl").innerHTML=h||'<div class="m">Henüz aidat eklenmedi.</div>';
  const tot=flt==="all"?by.sahsi+by.ticari:by[flt];
  $("tt").textContent=tl(tot);$("tc").textContent=`${cnt} kalem · Şahsi ${tl(by.sahsi)} · Ticari ${tl(by.ticari)}${mn>0?" · Asgari toplam "+tl(mn):""}`;
  const a=$("al"),o=$("ao");a.style.display=al.length?"block":"none";a.innerHTML=al.map(esc).join("<br>");o.style.display=od.length?"block":"none";o.innerHTML=od.map(esc).join("<br>");
  const opts='<option value="">Kartsız (elle yaz)</option>'+live("krt").map(c=>`<option value="${c.id}">${esc(c.name)} (${tname(c.type)})</option>`).join("");
  ["dcard","fcard"].forEach(i=>{const v=$(i).value;$(i).innerHTML=opts;if(v&&cardOf(v))$(i).value=v;$(i==="dcard"?"dextra":"fextra").style.display=$(i).value?"none":"block"});
}
function renderCards(){
  let h="";
  live("krt").sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(c=>{
    const cu=nextOcc(c.cutDay,c.time),du=nextOcc(c.dueDay,c.time);
    h+=`<div class="c"><div class="t">${c.holder?esc(c.holder)+"\n":""}${esc(c.name)}</div><div style="margin:4px 0"><span class="b tc">${tname(c.type)}</span></div>
    <div class="m">${cu?"Hesap kesim: her ayın "+c.cutDay+". günü · sıradaki "+esc(fmt(cu)):"Hesap kesim günü yok"}</div>
    <div class="m">${du?"Son ödeme: her ayın "+c.dueDay+". günü · sıradaki "+esc(fmt(du)):"Son ödeme günü yok"}</div>
    <div style="margin-top:8px"><button data-a="kics" data-i="${c.id}">Takvime ekle</button> <button data-a="ke" data-i="${c.id}">Düzenle</button> <button class="d" data-a="kx" data-i="${c.id}">Sil</button></div></div>`});
  $("kl").innerHTML=h||'<div class="m">Henüz kart eklenmedi. Kart eklersen hesap kesim ve son ödeme günleri her ay otomatik hatırlatılır.</div>';
}
function renderHist(){
  const P=live("pays"),cur=ymd(new Date()).slice(0,7),mo={};
  P.forEach(p=>{const k=String(p.date).slice(0,7);mo[k]=(mo[k]||0)+(+p.amount||0)});mo[cur]=mo[cur]||0;
  const keys=Object.keys(mo).sort().reverse();if(!hmSel||!Object.prototype.hasOwnProperty.call(mo,hmSel))hmSel=cur;
  $("hm").innerHTML=keys.map(k=>`<option value="${k}" ${k===hmSel?"selected":""}>${new Date(k+"-01T00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"})}</option>`).join("");
  const six=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=ymd(d).slice(0,7);six.push([k,mo[k]||0,d.toLocaleDateString("tr-TR",{month:"short"})])}
  const mx=Math.max(1,...six.map(x=>x[1]));
  $("bars").innerHTML=six.map(x=>`<div><i style="height:${Math.round(x[1]/mx*70)}px"></i>${x[2]}</div>`).join("");
  const L=P.filter(p=>String(p.date).slice(0,7)===hmSel).sort((a,b)=>(b.ts||0)-(a.ts||0)),by={sahsi:0,ticari:0},cc={};let t=0;
  L.forEach(p=>{t+=+p.amount||0;by[p.type]=(by[p.type]||0)+(+p.amount||0);cc[p.label]=(cc[p.label]||0)+(+p.amount||0)});
  $("ht").textContent=tl(t);$("hs").textContent=`Şahsi ${tl(by.sahsi)} · Ticari ${tl(by.ticari)} · ${L.length} ödeme`;
  $("hb").innerHTML=Object.keys(cc).length?'<div class="c"><b>Kartlara göre</b>'+Object.keys(cc).map(k=>`<div class="r"><span>${esc(k)}</span><b>${tl(cc[k])}</b></div>`).join("")+"</div>":"";
  $("hl").innerHTML=L.map(p=>`<div class="c"><div class="r"><div><div class="t">${esc(p.label)}</div><div class="m">${fd(p.date)} · ${esc(p.kind)} · ${tname(p.type)}</div></div><div><b>${tl(p.amount)}</b> <button class="d" data-a="hx" data-i="${p.id}">Sil</button></div></div></div>`).join("")||'<div class="m">Bu ay ödeme kaydı yok.</div>';
}
/* ---------- ödeme işlemleri ---------- */
function addPay(label,type,kind,amount,ref){put("pays",uid(),{date:ymd(new Date()),ts:Date.now(),label,type,kind,amount:+amount||0,ref})}
function openPay(title,note,def,cb){$("mt").textContent=title;$("mm").textContent=note;$("ma").value=def>0?def:"";mpCb=cb;$("mp").classList.add("o");setTimeout(()=>$("ma").focus(),50)}
function undo(id){Object.keys(S.pays).forEach(k=>{const p=S.pays[k];if(p&&!p.del&&p.ref===id)S.pays[k]={del:1,u:Date.now()}})}
function payDebt(id){const d=S.debts[id],r=rem(d);
  openPay("Ödeme yap",`${d.label} · kalan ${tl(r)}`,r,a=>{if(!(a>0)){alert("Tutar girin.");return false}const na=(+d.paidAmt||0)+a;addPay(d.label,d.type,"Borç",a,id);put("debts",id,{paidAmt:na,done:(+d.amount||0)-na<=0.005});return true})}
function payFee(id){const f=S.fees[id];
  openPay("Aidat ödendi",f.label,+f.amount||0,a=>{if(a>0)addPay(f.label,f.type,"Aidat",a,id);put("fees",id,{done:true});
    if(f.rep&&!f.rolled){const d=new Date(f.date+"T00:00");d.setFullYear(d.getFullYear()+1);put("fees",id,{rolled:true});put("fees",uid(),{cardId:f.cardId,label:f.label,type:f.type,amount:f.amount,date:ymd(d),time:f.time,rep:1,done:false})}return true})}
$("mo").onclick=()=>{const a=parseFloat($("ma").value)||0;if(mpCb&&mpCb(a)!==false){$("mp").classList.remove("o");mpCb=null}};
$("mc").onclick=()=>{$("mp").classList.remove("o");mpCb=null};
/* ---------- takvim dosyaları ---------- */
const vev=(id,z,rr,t,alarms)=>{const o=["BEGIN:VEVENT","UID:"+id+"@egetek","DTSTAMP:"+z,"DTSTART:"+z];if(rr)o.push("RRULE:"+rr);o.push("SUMMARY:"+t);alarms.forEach(a=>o.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+t,"TRIGGER:"+a,"END:VALARM"));o.push("END:VEVENT");return o};
const cal=ev=>["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EGETEK//Kart//TR"].concat(...ev,["END:VCALENDAR"]).join("\r\n");
const zs=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00";
const clean=t=>String(t).replace(/\n/g," - ").replace(/[,;]/g," ");
function dlFile(name,type,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function icsCard(c){const ev=[],n=(c.holder?c.holder+" - ":"")+c.name,cu=nextOcc(c.cutDay,c.time),du=nextOcc(c.dueDay,c.time);
  if(cu)ev.push(vev(c.id+"c",zs(cu),"FREQ=MONTHLY;BYMONTHDAY="+c.cutDay,clean(n+" - Hesap Kesim Tarihi"),["PT0M"]));
  if(du)ev.push(vev(c.id+"d",zs(du),"FREQ=MONTHLY;BYMONTHDAY="+c.dueDay,clean(n+" - Son Odeme Gunu"),["PT0M","-P1D"]));
  return cal(ev)}
function icsFee(f){return cal([vev(f.id,f.date.replace(/-/g,"")+"T"+(f.time||"09:00").replace(":","")+"00",f.rep?"FREQ=YEARLY":"",clean("Kart aidati - "+f.label),["PT0M","-P1D"])])}
/* ---------- hatırlatma listesi (masaüstü bildirimi) ---------- */
function reminders(){
  const L=[],now=Date.now(),t=new Date();
  live("krt").forEach(c=>{const n=(c.holder?c.holder+"\n":"")+c.name;
    const cu=nextOcc(c.cutDay,c.time);if(cu)L.push({k:"cu"+c.id+cu.getTime(),at:cu.getTime(),t:n+"\nHesap Kesim Tarihi"});
    const du=nextOcc(c.dueDay,c.time);if(du){L.push({k:"du"+c.id+du.getTime(),at:du.getTime(),t:n+"\nSon Ödeme Günü"},{k:"du1"+c.id+du.getTime(),at:du.getTime()-864e5,t:"Yarın son ödeme: "+c.name})}});
  live("fees").forEach(f=>{if(f.done)return;const a=new Date(f.date+"T"+(f.time||"09:00")).getTime(),x="Kart aidatı: "+f.label+(+f.amount>0?" "+tl(f.amount):"");L.push({k:"f"+f.id,at:a,t:x},{k:"f1"+f.id,at:a-864e5,t:"Yarın "+x})});
  live("debts").forEach(d=>{if(d.done)return;const a=new Date(d.due+"T09:00").getTime(),x="Son ödeme: "+d.label+" "+tl(rem(d));L.push({k:"d"+d.id,at:a,t:x},{k:"d1"+d.id,at:a-864e5,t:"Yarın "+x});
    if(dl(d.due+"T00:00")<0&&t.getHours()>=9)L.push({k:"od"+d.id+ymd(t),at:now-1000,t:"GECİKMİŞ borç: "+d.label+" "+tl(rem(d))})});
  return L.filter(x=>x.at>now-3e5);
}
function pushRem(){if(window.egetek&&window.egetek.setReminders){try{window.egetek.setReminders(reminders())}catch(e){}}}
const shown={};
setInterval(()=>{if(window.egetek)return;try{if(Notification.permission!=="granted")return}catch(e){return}const now=Date.now();
  reminders().forEach(r=>{if(r.at<=now&&now-r.at<3e5&&!shown[r.k]){shown[r.k]=1;new Notification("EGETEK Hatırlatma",{body:r.t})}})},20000);
setInterval(pushRem,60000);
/* ---------- Google Drive ---------- */
const st=t=>{$("st").textContent=t};
const loadGIS=()=>new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=()=>rej(new Error("Google betiği yüklenemedi (internet?)"));document.head.appendChild(s)});
function getTok(inter){
  if(tok&&Date.now()<tokExp-60000)return Promise.resolve(tok);
  const cid=localStorage.getItem(CK);if(!cid)return Promise.reject(new Error("Önce Ayarlar’dan Client ID girin"));
  return loadGIS().then(()=>new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:"https://www.googleapis.com/auth/drive.appdata",
      callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+(r.expires_in||3600)*1000;localStorage.setItem("egetek_was","1");res(tok)},
      error_callback:e=>rej(new Error(e.type||"yetki hatası"))});
    c.requestAccessToken({prompt:inter?"select_account":""})}))}
const api=(url,opt={})=>{opt.headers=Object.assign({Authorization:"Bearer "+tok},opt.headers||{});return fetch(url,opt).then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error("Drive "+r.status+": "+t.slice(0,120))});return r})};
const findFile=()=>fid?Promise.resolve(fid):api("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+encodeURIComponent("name='"+FN+"'")+"&fields=files(id)").then(r=>r.json()).then(j=>{fid=j.files&&j.files[0]?j.files[0].id:null;return fid});
function merge(a,b){const o={mig:1};COLS.forEach(col=>{o[col]={};const x=a[col]||{},y=b[col]||{};new Set(Object.keys(x).concat(Object.keys(y))).forEach(k=>{const p=x[k],q=y[k];o[col][k]=!p?q:!q?p:(q.u>p.u?q:p)})});return o}
function sync(quiet){
  if(!localStorage.getItem("egetek_was")&&quiet)return Promise.resolve();
  if(syncing){pend=true;return Promise.resolve()}
  syncing=true;st("Eşleniyor…");
  return getTok(!quiet).then(findFile).then(id=>id?api("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media").then(r=>r.json()):null).then(remote=>{
    if(remote)S=merge(S,remote);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    const body=JSON.stringify(S);
    if(fid)return api("https://www.googleapis.com/upload/drive/v3/files/"+fid+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    const bd="egetek"+Date.now(),mp="--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify({name:FN,parents:["appDataFolder"]})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
    return api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp}).then(r=>r.json()).then(j=>{fid=j.id})
  }).then(()=>{st("Drive ile eşlendi · "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}));render()})
  .catch(e=>st("Eşleme hatası: "+e.message)).then(()=>{syncing=false;if(pend){pend=false;sync(true)}});
}
/* ---------- PIN ---------- */
async function hash(p){const s="egetek|"+p;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return "d"+h}}
function lock(){if(localStorage.getItem(PK)){$("lock").classList.add("o");$("pin").value="";$("pe").textContent="";setTimeout(()=>$("pin").focus(),50)}}
$("un").onclick=async()=>{if(await hash($("pin").value)===localStorage.getItem(PK)){$("lock").classList.remove("o");last=Date.now()}else $("pe").textContent="PIN yanlış"};
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("un").click()});
$("fg").onclick=()=>{if(confirm("PIN sıfırlanacak ve bu cihazdaki yerel veriler silinecek (Drive eşlemesi açıksa Drive’dan geri gelir). Devam?")){localStorage.removeItem(PK);localStorage.removeItem(LS);localStorage.removeItem(OLD);location.reload()}};
$("sp").onclick=async()=>{const p=$("np").value;if(!/^\d{4,8}$/.test(p)){alert("PIN 4-8 rakam olmalı.");return}localStorage.setItem(PK,await hash(p));$("np").value="";alert("PIN belirlendi.")};
$("rp").onclick=()=>{if(confirm("PIN kaldırılsın mı?")){localStorage.removeItem(PK);alert("PIN kaldırıldı.")}};
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{last=Date.now()},true));
setInterval(()=>{if(localStorage.getItem(PK)&&Date.now()-last>3e5&&!$("lock").classList.contains("o"))lock()},30000);
/* ---------- arayüz olayları ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("o",s.id==="t-"+b.dataset.t))});
document.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{flt=b.dataset.fl;document.querySelectorAll("[data-fl]").forEach(x=>x.classList.toggle("on",x===b));renderMain()});
const days=sel=>{$(sel).innerHTML='<option value="">Yok</option>'+Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join("")};days("kc");days("kd");
["dd","fdate","ftime","ktm"].forEach(id=>{const e=$(id);e.addEventListener("click",()=>{try{e.showPicker()}catch(x){}})});
$("dcard").onchange=()=>{$("dextra").style.display=$("dcard").value?"none":"block"};$("fcard").onchange=()=>{$("fextra").style.display=$("fcard").value?"none":"block"};
document.addEventListener("click",e=>{const t=e.target,a=t.getAttribute&&t.getAttribute("data-a");if(!a)return;const i=t.getAttribute("data-i");
  if(a==="dk"){if(t.checked){t.checked=false;payDebt(i)}else{if(confirm("Bu borcun ödeme kayıtları geri alınsın mı?")){undo(i);put("debts",i,{paidAmt:0,done:false})}else t.checked=true}}
  else if(a==="dp")payDebt(i);
  else if(a==="de"){const d=S.debts[i];edD=i;$("dcard").value=cardOf(d.cardId)?d.cardId:"";$("dcard").onchange();$("dlab").value=d.label||"";$("dtype").value=d.type||"sahsi";$("da").value=d.amount;$("dmin").value=d.minPay||"";$("dd").value=d.due;$("fd").classList.add("o")}
  else if(a==="dx"){if(confirm("Bu borç silinsin mi?"))del("debts",i)}
  else if(a==="fk"){if(t.checked){t.checked=false;payFee(i)}else{if(confirm("Bu aidatın ödeme kaydı geri alınsın mı?")){undo(i);put("fees",i,{done:false})}else t.checked=true}}
  else if(a==="fx"){if(confirm("Aidat kaydı silinsin mi?"))del("fees",i)}
  else if(a==="fics")dlFile("egetek-aidat.ics","text/calendar",icsFee(Object.assign({id:i},S.fees[i])));
  else if(a==="ke"){const c=S.krt[i];edK=i;$("kh").value=c.holder||"";$("kn").value=c.name;$("kt").value=c.type||"sahsi";$("kc").value=c.cutDay||"";$("kd").value=c.dueDay||"";$("ktm").value=c.time||"09:00";$("fk").classList.add("o")}
  else if(a==="kx"){if(confirm("Kart silinsin mi? Geçmiş kayıtlar korunur."))del("krt",i)}
  else if(a==="kics")dlFile("egetek-kart.ics","text/calendar",icsCard(Object.assign({id:i},S.krt[i])));
  else if(a==="hx"){if(confirm("Bu ödeme kaydı silinsin mi?"))del("pays",i)}});
$("hm").onchange=()=>{hmSel=$("hm").value;renderHist()};
$("addK").onclick=()=>{edK=null;["kh","kn"].forEach(x=>$(x).value="");$("kt").value="sahsi";$("kc").value="";$("kd").value="";$("ktm").value="09:00";$("fk").classList.add("o")};
$("ck").onclick=()=>$("fk").classList.remove("o");
$("sk").onclick=()=>{const n=$("kn").value.trim(),cu=parseInt($("kc").value,10)||"",du=parseInt($("kd").value,10)||"";
  if(!n){alert("Kart adı gerekli.");return}if(!cu&&!du){alert("Hesap kesim veya son ödeme gününden en az birini seçin.");return}
  put("krt",edK||uid(),{holder:$("kh").value.trim(),name:n,type:$("kt").value,cutDay:cu,dueDay:du,time:$("ktm").value||"09:00"});$("fk").classList.remove("o")};
$("addD").onclick=()=>{edD=null;$("dcard").value="";$("dcard").onchange();["dlab","da","dmin","dd"].forEach(x=>$(x).value="");$("fd").classList.add("o")};
$("cd").onclick=()=>$("fd").classList.remove("o");
$("sd").onclick=()=>{const cid=$("dcard").value,c=cardOf(cid),lab=c?c.name:$("dlab").value.trim(),type=c?c.type:$("dtype").value,am=parseFloat($("da").value),mn=parseFloat($("dmin").value)||0,du=$("dd").value;
  if(!lab||!(am>0)||!du){alert("Kart/açıklama, toplam borç ve son ödeme tarihi gerekli.");return}
  const old=edD?S.debts[edD]:null,o={cardId:c?cid:"",label:lab,type,amount:am,minPay:mn,due:du};
  if(!old){o.paidAmt=0;o.done=false}else o.done=am-(+old.paidAmt||0)<=0.005;
  put("debts",edD||uid(),o);edD=null;$("fd").classList.remove("o")};
$("addF").onclick=()=>{$("fcard").value="";$("fcard").onchange();["flab","famt","fdate"].forEach(x=>$(x).value="");$("ff").classList.add("o")};
$("cf").onclick=()=>$("ff").classList.remove("o");
$("sf").onclick=()=>{const cid=$("fcard").value,c=cardOf(cid),lab=c?c.name:$("flab").value.trim(),type=c?c.type:$("ftype").value,dt=$("fdate").value,am=parseFloat($("famt").value);
  if(!lab||!dt){alert("Kart/açıklama ve aidat tarihi gerekli.");return}
  put("fees",uid(),{cardId:c?cid:"",label:lab,type,date:dt,time:$("ftime").value||"09:00",amount:am>0?am:0,rep:$("frep").value==="1"?1:0,done:false});$("ff").classList.remove("o")};
$("se").onclick=()=>{$("cid").value=localStorage.getItem(CK)||"";$("fs").classList.toggle("o")};
$("ss").onclick=()=>{localStorage.setItem(CK,$("cid").value.trim());tok=null;fid=null;$("fs").classList.remove("o");st("Client ID kaydedildi")};
$("sy").onclick=()=>sync(false);
$("exp").onclick=()=>dlFile("egetek-yedek.json","application/json",JSON.stringify(S));
$("nb").onclick=()=>{try{Notification.requestPermission().then(p=>{$("nb").textContent=p==="granted"?"Bildirim açık":"Bildirim kapalı"})}catch(e){alert("Bu tarayıcı bildirimi desteklemiyor.")}};
setInterval(()=>sync(true),3e5);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync(true)});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();lock();
if(localStorage.getItem("egetek_was"))sync(true);
})();
</script>
